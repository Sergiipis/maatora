name: Feature request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for thinking about how to make maatora better. Before
        opening a feature request, please skim `CONTRIBUTING.md` —
        the section "Out of scope" lists deliberate non-goals for the core SDK.

  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: |
        What are you trying to accomplish? Describe the situation in your
        codebase or workflow, not the feature you've already designed in your head.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
      description: |
        If you have a concrete proposal, describe the function signature,
        config option, or behavior. Otherwise leave blank — describing the
        problem is enough.
      render: python

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: |
        Existing workarounds, related libraries, or designs you ruled out.

  - type: dropdown
    id: integration
    attributes:
      label: Which area does this touch?
      multiple: true
      options:
        - Decorator / middleware
        - Cryptographic signing
        - Merkle log
        - FastAPI ingest
        - Storage backends (Postgres, etc.)
        - CLI
        - HTML / report rendering
        - Examples
        - Documentation
        - CI / packaging
        - Other
    validations:
      required: true
