name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build dist + SBOM + Sigstore signatures
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build cyclonedx-bom pip-audit

      - name: Build sdist + wheel
        run: python -m build

      - name: Read tag version
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify pyproject version matches tag
        run: |
          PYPROJECT_VERSION="$(python -c 'import tomllib,sys; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PYPROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: pyproject=$PYPROJECT_VERSION tag=$TAG_VERSION" >&2
            exit 1
          fi
          echo "Version match: $PYPROJECT_VERSION"

      - name: Install the wheel into the runner env (for SBOM and audit)
        run: pip install "dist/maatora-${GITHUB_REF_NAME#v}-py3-none-any.whl"

      - name: Generate CycloneDX SBOM
        run: |
          cyclonedx-py environment --of JSON -o dist/sbom.cdx.json
          cyclonedx-py environment --of XML  -o dist/sbom.cdx.xml
          ls -la dist/

      - name: Audit installed dependencies for known CVEs
        run: |
          # Audit transitive deps only — our own package ("maatora") is
          # being published by this very workflow, so it is not on PyPI
          # yet and would make pip-audit fail with "not found".
          pip list --format freeze | grep -v "^maatora==" > /tmp/runtime-deps.txt
          echo "--- runtime deps ---"
          cat /tmp/runtime-deps.txt
          pip-audit --strict --format columns --requirement /tmp/runtime-deps.txt

      - name: Sign wheel and sdist with Sigstore (Fulcio + Rekor)
        # Standalone Sigstore bundles, independent of the PEP 740 attestations
        # that PyPI generates from `attestations: true` in publish-pypi. Even
        # if the package is one day yanked from PyPI, the Sigstore signature
        # remains in the public transparency log and the bundle is attached
        # to the GitHub Release.
        uses: sigstore/gh-action-sigstore-python@04cffa1d795717b140764e8b640de88853c92acc # v3.3.0
        with:
          inputs: |
            ./dist/*.whl
            ./dist/*.tar.gz

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 30

  publish-pypi:
    name: Publish to PyPI (Trusted Publisher + PEP 740 attestations)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/maatora/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Drop non-distribution files from dist/
        run: |
          # gh-action-pypi-publish refuses unknown filenames; keep only sdist + wheel.
          find dist/ -mindepth 1 -maxdepth 1 ! -name '*.whl' ! -name '*.tar.gz' -delete
          ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1 (v1.14.0)
        with:
          attestations: true
          skip-existing: true
          print-hash: true

  github-release:
    name: Create GitHub Release with SBOM
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Generate SHA256SUMS
        run: |
          cd dist
          ls -la
          sha256sum maatora-*.whl maatora-*.tar.gz sbom.cdx.json sbom.cdx.xml \
              *.sigstore.json 2>/dev/null \
              | tee SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/maatora-*.whl
            dist/maatora-*.tar.gz
            dist/*.sigstore.json
            dist/sbom.cdx.json
            dist/sbom.cdx.xml
            dist/SHA256SUMS
