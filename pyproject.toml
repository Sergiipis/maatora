[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maatora"
version = "0.1.0"
description = "Cryptographic action receipts for AI agents: canonical JSON, Ed25519 signing, Merkle log, FastAPI ingest, LangGraph middleware, Postgres store, HTML rendering."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sergiipis", email = "serjus83@outlook.com" }]
maintainers = [{ name = "Sergiipis", email = "serjus83@outlook.com" }]
readme = "README.md"
keywords = [
    "audit",
    "receipts",
    "ai-agents",
    "ed25519",
    "merkle",
    "compliance",
    "ai-act",
    "soc2",
    "tamper-evident",
    "provenance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "cryptography>=42",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
audit = [
    "qrcode>=7.4",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "qrcode>=7.4",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "qrcode>=7.4",
    "ruff>=0.7",
    "mypy>=1.10",
    "types-jinja2",
]

[project.urls]
Homepage = "https://github.com/Sergiipis/maatora"
Repository = "https://github.com/Sergiipis/maatora"
Issues = "https://github.com/Sergiipis/maatora/issues"
Changelog = "https://github.com/Sergiipis/maatora/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Sergiipis/maatora#readme"

[project.scripts]
maatora = "maatora.cli_viewer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maatora = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long (handled by ruff format)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
